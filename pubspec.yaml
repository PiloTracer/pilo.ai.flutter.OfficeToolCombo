name: office_tool_combo
description: Desktop office tools combo — Excel consolidate, inventory, PDF factory, price monitor, scheduled backup.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.3.0
  dio: ^5.11.0
  drift: ^2.34.3
  sqlite3: ^3.5.0
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  equatable: ^2.1.0
  decimal: ^3.2.4
  excel: ^4.0.6
  file_picker: ^11.0.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  image: ^4.3.0
  csv: ^6.0.0
  flutter_zxing: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  build_runner: ^2.15.1
  drift_dev: ^2.28.0
  freezed: ^3.2.5
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  generate: true
