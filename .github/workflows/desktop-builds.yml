# Desktop builds for Linux, macOS and Windows — each on its own OS, because
# Flutter does not cross-compile desktop apps. Derived from the Flutter Agent OS
# template templates/ci/github-actions/flutter-gates.yml (desktop jobs only).
#
# Every output lands under one tree, versioned from pubspec.yaml:
#
#   releases/<version>/linux/office_tool_combo-<version>-linux.tar.gz
#   releases/<version>/macos/office_tool_combo-<version>-macos.zip
#   releases/<version>/windows/office_tool_combo-<version>-windows.zip
#
# The `releases` artifact holds the whole tree. Download it with
#   gh run download <run-id> -n releases -D releases
# These are UNSIGNED development builds. Distribution needs signing and
# notarization in a release workflow (Flutter Agent OS DESKTOP_STANDARD §8).
#
# Flutter pin: DOCS_FLUTTER_STACK.md (keep both in sync).

name: desktop-builds

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  desktop-linux:
    name: desktop build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Linux build toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Linux release build
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package into releases/<version>/linux
        # tar keeps the executable bit, which upload-artifact alone drops.
        run: |
          version="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*//')"
          out="releases/${version}/linux"
          mkdir -p "$out"
          bundle="$(ls -d build/linux/*/release/bundle | head -1)"
          tar -czf "${out}/office_tool_combo-${version}-linux.tar.gz" -C "$bundle" .
          ls -lR releases

      - uses: actions/upload-artifact@v7
        with:
          name: office_tool_combo-linux
          path: releases/
          if-no-files-found: error

  desktop-macos:
    name: desktop build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: macOS release build
        run: |
          flutter pub get
          flutter build macos --release

      - name: Package into releases/<version>/macos
        # ditto keeps the bundle's symlinks and permissions. Unsigned and
        # unnotarized: on other Macs, right-click > Open (or remove quarantine).
        run: |
          version="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*//')"
          out="releases/${version}/macos"
          mkdir -p "$out"
          app="$(ls -d build/macos/Build/Products/Release/*.app | head -1)"
          ditto -c -k --keepParent "$app" "${out}/office_tool_combo-${version}-macos.zip"
          ls -lR releases

      - uses: actions/upload-artifact@v7
        with:
          name: office_tool_combo-macos
          path: releases/
          if-no-files-found: error

  desktop-windows:
    name: desktop build (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Windows release build
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package into releases/<version>/windows
        # The .exe needs the DLLs and data/ folder beside it; ship the folder.
        run: |
          version="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*//')"
          out="releases/${version}/windows"
          mkdir -p "$out"
          zip_path="$(pwd)/${out}/office_tool_combo-${version}-windows.zip"
          release="$(ls -d build/windows/*/runner/Release | head -1)"
          (cd "$release" && 7z a -tzip "$zip_path" . >/dev/null)
          ls -lR releases

      - uses: actions/upload-artifact@v7
        with:
          name: office_tool_combo-windows
          path: releases/
          if-no-files-found: error

  releases:
    name: combined releases tree
    needs: [desktop-linux, desktop-macos, desktop-windows]
    runs-on: ubuntu-latest
    steps:
      # Each per-OS artifact holds <version>/<os>/<file>; merging them
      # reassembles releases/<version>/{linux,macos,windows}/.
      - uses: actions/download-artifact@v8
        with:
          pattern: office_tool_combo-*
          path: releases
          merge-multiple: true

      - name: Show the tree
        run: find releases -type f -exec ls -l {} \;

      - uses: actions/upload-artifact@v7
        with:
          name: releases
          path: releases/
          if-no-files-found: error
